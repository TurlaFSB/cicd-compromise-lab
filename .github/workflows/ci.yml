name: CI

# Runs every scenario's verification suite and lints all shell scripts.
# This workflow follows the same rules the lab teaches: least-privilege
# permissions, SHA-pinned actions, no secrets, and no pull_request_target.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint shell scripts
        run: |
          shopt -s nullglob
          shellcheck lab detections/*/detect.sh verify/*/verify.sh

      - name: Byte-compile Python helpers
        run: python3 -m py_compile detections/to_sarif.py

  verify:
    name: Verify scenarios
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run all verification suites
        run: ./lab verify

  scan-self:
    name: Scan own workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run lab scanners against this repository's own workflows
        run: ./lab scan .

  action-selftest:
    name: Action wrapper self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Action passes on this repository
        uses: ./

      - name: Action reports findings on a known-vulnerable workflow
        id: vulnerable
        uses: ./
        with:
          path: tests/fixtures/vulnerable
          fail-on-findings: "false"

      - name: Assert the vulnerable fixture was flagged
        env:
          FINDINGS: ${{ steps.vulnerable.outputs.findings }}
        run: |
          if [ "${FINDINGS:-0}" -lt 1 ]; then
            echo "::error::wrapper failed to flag the vulnerable fixture"
            exit 1
          fi

      - name: Action emits SARIF for the vulnerable fixture
        id: sarif
        uses: ./
        with:
          path: tests/fixtures/vulnerable
          fail-on-findings: "false"
          sarif-file: fixture.sarif

      # Validate the SARIF is well-formed and non-empty. We deliberately do NOT
      # upload it to the Security tab: these are intentional lab fixtures, not
      # real issues in this repository.
      - name: Validate generated SARIF
        env:
          SARIF_FILE: ${{ steps.sarif.outputs.sarif-file }}
        run: |
          test -n "$SARIF_FILE" || { echo "::error::no SARIF file produced"; exit 1; }
          python3 - "$SARIF_FILE" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d["version"] == "2.1.0", d.get("version")
          run = d["runs"][0]
          rules = {r["id"] for r in run["tool"]["driver"]["rules"]}
          results = run["results"]
          assert results, "expected at least one result for the fixture"
          orphans = [r["ruleId"] for r in results if r["ruleId"] not in rules]
          assert not orphans, f"results reference undeclared rules: {orphans}"
          for r in results:
              loc = r["locations"][0]["physicalLocation"]["artifactLocation"]["uri"]
              assert loc.startswith(".github/workflows/"), loc
          print(f"SARIF valid: {len(rules)} rules, {len(results)} results")
          PY
