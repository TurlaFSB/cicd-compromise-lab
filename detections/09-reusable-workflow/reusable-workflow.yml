title: GitHub Actions Reusable Workflow Called Unsafely (Mutable Ref / secrets inherit)
id: f3c6b0d8-9e4a-4d32-a8f1-5b2c0e3d7a9c
status: experimental
description: |
  Detects callers that invoke a reusable workflow by a mutable ref, or with
  `secrets: inherit`. A mutable ref (@main, @v1) lets the workflow's owner
  change what runs on the next call — the reusable-workflow form of a tag
  hijack. `secrets: inherit` passes every secret the caller holds to the
  callee, so a compromise or malicious change in the reusable workflow — above
  all one in another organization — reaches all of them at once.

  This rule fires on the workflow definition (YAML), not on runtime logs.
references:
  - https://owasp.org/www-project-top-10-ci-cd-security-risks/CICD-SEC-03-Dependency-Chain-Abuse
  - https://docs.github.com/en/actions/sharing-automations/reusing-workflows#passing-inputs-and-secrets-to-a-reusable-workflow
  - https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#reusing-third-party-workflows
author: TurlaFSB
date: 2026-10-17
tags:
  - attack.t1195.001
  - attack.supply_chain
  - cicd_sec_3
  - cicd_sec_4
logsource:
  category: ci_cd
  product: github_actions
  service: workflow_definition
detection:
  reusable_mutable_ref:
    # a reusable-workflow uses: (points at a workflow file) pinned to a non-SHA ref
    uses|re: 'uses:\s+[^./\s][^\s]*/\.github/workflows/[^@\s]+@(?![0-9a-f]{40})\S+'
  secrets_inherit:
    secrets|re: '^\s*secrets:\s*inherit\s*$'
  condition: reusable_mutable_ref or secrets_inherit
falsepositives:
  - Local reusable workflows referenced as ./.github/workflows/x.yml are
    same-repo and have no external ref to hijack.
  - A trusted first-party reusable workflow pinned by SHA that legitimately
    needs most secrets; prefer explicit names over inherit even then.
level: high
