title: GitHub Actions Secret Exfiltration Patterns
id: f4e8c7d9-3b2a-4f15-9e6c-8d1a5b0c2e7f
status: experimental
description: >
  Detects workflow configurations that expose secrets to exfiltration
  through multiple vectors: secrets printed in logs (directly or after
  transformation), secrets scoped too broadly (available to jobs/steps
  that do not need them), static long-lived credentials without
  environment gates, overly permissive workflow-level permissions,
  and debug-mode exposure of environment variables.
references:
  - https://owasp.org/www-project-top-10-ci-cd-security-risks/CICD-SEC-06-Insufficient-Credential-Hygiene
  - https://docs.github.com/en/actions/security-for-github-actions/security-guides/using-secrets-in-github-actions
  - https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions
  - https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication
  - https://unit42.paloaltonetworks.com/github-repo-artifacts-leak-tokens/
author: TurlaFSB/cicd-compromise-lab
date: 2026/10/11
tags:
  - attack.credential_access
  - attack.t1552
  - attack.t1552.001
  - cicd_sec_6
  - cicd_sec_5
logsource:
  category: ci_cd
  product: github_actions
  definition: >
    Applies to GitHub Actions workflow YAML files (.github/workflows/*.yml).
    Detection targets static analysis of workflow definitions, not runtime
    log output (though runtime detection is covered by the companion
    detect.sh script).
detection:
  # ── Vector 1: Secret value printed in logs ──────────────────────
  secret_in_echo:
    run|contains:
      - 'echo "$DEPLOY_KEY'
      - 'echo "${DEPLOY_KEY'
      - 'echo $DEPLOY_KEY'
      - 'echo "${{ secrets.'
      - 'printf.*secrets\.'
      - 'cat.*secrets\.'

  secret_transformed:
    run|contains:
      - '| base64'
      - '| xxd'
      - '| od -'
      - '| hexdump'
      - '| openssl enc'
      - '| rev'
      - '| cut -c'

  # ── Vector 2: Secrets scoped to jobs that don't need them ──────
  secret_broad_scope:
    env|contains:
      - 'secrets.DEPLOY_KEY'
      - 'secrets.AWS_'
      - 'secrets.GCP_'
      - 'secrets.AZURE_'
      - 'secrets.NPM_TOKEN'
      - 'secrets.DOCKER_'

  # ── Vector 3: Overly broad workflow-level permissions ──────────
  broad_permissions:
    permissions|contains:
      - 'contents: write'
      - 'packages: write'
      - 'write-all'

  # ── Vector 4: Debug logging exposure ────────────────────────────
  debug_exposure:
    env|contains:
      - 'ACTIONS_STEP_DEBUG'
      - 'ACTIONS_RUNNER_DEBUG'

  condition: secret_in_echo or (secret_transformed and secret_broad_scope) or debug_exposure or (broad_permissions and secret_broad_scope)
falsepositives:
  - Workflows that intentionally set ACTIONS_STEP_DEBUG for troubleshooting (should be temporary)
  - Workflows that pipe non-secret data through base64 for encoding purposes
  - Workflows with legitimate write permissions at the workflow level (e.g., release workflows)
level: high
