name: Issue triage (HARDENED — scenario 02 fix)

# FIX: The vulnerable workflow interpolated github.event.issue.title
# directly into a run: shell step using ${{ }} template expansion.
# GitHub Actions performs this expansion as a literal string substitution
# BEFORE the shell parses the line — so an issue title containing shell
# metacharacters (backticks, $(), ;, &&, |, newlines) becomes executable
# code inside the generated script.
#
# This hardened version eliminates the injection by:
#
#   1. Passing every untrusted context value (issue title, body, author)
#      through an intermediate environment variable. Environment variables
#      are set by the runner, not by shell expansion, so metacharacters in
#      the value are DATA — they never become part of the script itself.
#
#   2. Quoting the environment variable in the shell script ("$ISSUE_TITLE")
#      so the shell treats it as a single token even if it contains spaces,
#      wildcards, or other special characters.
#
#   3. Applying least-privilege permissions — only issues: write (needed
#      to add a triage comment), and contents: read (default).
#
#   4. Pinning all third-party actions to full commit SHAs to prevent
#      mutable-tag hijack (CICD-SEC-3).
#
# The combination of env-variable indirection and shell quoting makes
# the workflow safe against ANY content in the issue title — including
# backticks, $(), semicolons, pipes, newlines, and null bytes.
#
# Standards:
#   OWASP CICD-SEC-1 — Insufficient Flow Control Mechanisms (mitigated)
#   OWASP CICD-SEC-4 — Poisoned Pipeline Execution (eliminated)
#   MITRE ATT&CK T1059.004 — Unix Shell command injection (prevented)
#
# Every third-party action is pinned to a full commit SHA, not a mutable
# tag (CICD-SEC-3 defense), with the tag noted in a comment for humans.

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Greet the issue author (HARDENED — untrusted data in env, not in script)
        env:
          # Pass untrusted context through environment variables.
          # The runner sets these BEFORE the shell starts — their values
          # are never parsed as shell syntax, regardless of content.
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.actor.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Double-quoted variable references ensure the shell treats
          # each value as a single string, not as code to interpret.
          echo "Thanks for opening #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
          echo "Author: ${ISSUE_AUTHOR}"
          echo "Triage complete."

      # NOTE: DUMMY_CLOUD_KEY is deliberately NOT passed to any step.
      # The vulnerable workflow exposed it via env: in the same step
      # that ran untrusted shell code. Even with the injection fixed,
      # secrets should only be passed to steps that actually need them.
