name: PR check (HARDENED — scenario 05 fix)

# FIX (writer side): the vulnerable pr-check.yml ran a read-write
# actions/cache on pull_request, letting fork code save entries under a key
# the release build restored. This version:
#
#   1. Uses actions/cache/restore (READ-ONLY) — a fork PR can speed its own
#      build up by reading a cache, but can never WRITE one.
#   2. Keys the cache to hashFiles() of the lockfile, so the key is bound to
#      repository content an attacker cannot change without changing the key.
#   3. Caches only the pure download directory (~/.npm), never build output.
#
# A fork PR now has no way to place content under a key any trusted build
# will restore.
#
# OWASP CICD-SEC-9 — Improper Artifact Integrity Validation (eliminated)
# MITRE ATT&CK T1195.002 — Compromise Software Supply Chain (mitigated)

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20

      # Read-only restore, keyed to the lockfile hash. No save step, so this
      # workflow cannot populate any cache entry.
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - run: npm ci
      - run: npm run build
