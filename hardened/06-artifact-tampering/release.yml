name: Release (HARDENED — scenario 06 fix)

# FIX: the vulnerable release.yml moved dist/ from build to publish with no
# integrity binding, so a tampered artifact would be shipped. This version
# binds the published bytes to the trusted build with SLSA provenance:
#
#   1. The build job generates a signed build-provenance attestation over the
#      artifact with actions/attest-build-provenance. The attestation is tied
#      to this repo, this workflow, and this commit via the job's OIDC
#      identity, and recorded in GitHub's attestation store + a public
#      transparency log.
#
#   2. The publish job runs `gh attestation verify` against the downloaded
#      artifact BEFORE publishing. If a single byte changed between build and
#      publish, verification fails and the job exits non-zero — nothing is
#      shipped.
#
#   3. A SHA-256 checksum is also recorded and re-checked as a cheap,
#      offline second line of defence.
#
# OWASP CICD-SEC-9 — Improper Artifact Integrity Validation (eliminated)
# MITRE ATT&CK T1195 — Supply Chain Compromise (mitigated)
# SLSA Build L3 — non-falsifiable provenance generated by the build platform

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # mint the OIDC token that signs the attestation
      attestations: write    # record the build-provenance attestation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
      - run: npm ci && npm run build

      # Record a checksum alongside the artifact (cheap offline check).
      - name: Checksum
        run: |
          cd dist
          find . -type f -exec sha256sum {} + > ../dist.sha256
          cd ..

      # Signed SLSA build-provenance attestation over every built file.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/**"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: |
            dist/
            dist.sha256

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write        # gh attestation verify uses OIDC
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: .

      # VERIFY BEFORE PUBLISH — abort if the bytes are not what the build
      # job attested. This is the gate the vulnerable version lacked.
      - name: Verify checksum
        run: sha256sum --check dist.sha256

      - name: Verify build provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "dist/" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
