name: CI (VULNERABLE — scenario 10)

# VULNERABLE: grants the GITHUB_TOKEN every scope with `write-all`, and the
# workflow runs on `pull_request_target`, which is reachable by a fork PR.
# Any step that is ever compromised (a poisoned dependency, an injected
# command, a hijacked action) inherits a token that can push code, publish
# packages, mint OIDC tokens, and tamper with Actions caches and artifacts.
#
# OWASP CICD-SEC-5 — Insufficient Pipeline-Based Access Controls
# MITRE ATT&CK T1078.004 — Valid Accounts: Cloud Accounts

on:
  pull_request_target:
  push:
    branches: [main]

permissions: write-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run tests
        run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Lint
        run: make lint
